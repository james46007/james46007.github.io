<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:1200px;height:630px;background:#090a0f;color:#e2e8f0;overflow:hidden}
  body{box-sizing:border-box;padding:72px 80px;position:relative;font-family:"Plus Jakarta Sans",sans-serif;display:flex;flex-direction:column;justify-content:space-between}
  .glow{position:absolute;width:900px;height:900px;left:50%;top:-420px;transform:translateX(-50%);background:radial-gradient(circle,rgba(37,99,235,.28) 0%,rgba(9,10,15,0) 65%)}
  .badge{position:relative;display:inline-flex;align-items:center;gap:12px;align-self:flex-start;padding:10px 18px;border-radius:999px;font-size:22px;font-weight:500;background:rgba(59,130,246,.1);color:#60a5fa;border:1px solid rgba(59,130,246,.2)}
  .dot{width:12px;height:12px;border-radius:50%;background:#34d399}
  h1{position:relative;margin:0;font-size:84px;line-height:1.08;font-weight:800;letter-spacing:-.02em;background:linear-gradient(135deg,#fff 30%,#94a3b8 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .foot{position:relative;display:flex;justify-content:space-between;align-items:center;font-size:26px;color:#94a3b8}
  .me{display:flex;align-items:center;gap:14px;color:#fff;font-weight:700}
  .jy{display:grid;place-items:center;width:48px;height:48px;border-radius:12px;background:#2563eb;font-size:20px}
</style></head>
<body>
  <div class="glow"></div>
  <div class="badge"><span class="dot"></span>Software Engineer • Modern Web Platforms</div>
  <h1>Building resilient web applications &amp; design systems.</h1>
  <div class="foot"><span class="me"><span class="jy">JY</span>Jimmy Yar</span><span>james46007.github.io</span></div>
</body></html>
